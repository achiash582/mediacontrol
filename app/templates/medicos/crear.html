{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-primary mb-3">{{ 'Editar Médico' if medico else 'Registrar Nuevo Médico' }}</h2>
    <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required
                   placeholder="Ej. Dr. Carlos Mendoza" value="{{ medico.nombre if medico else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <input type="text" name="especialidad" class="form-control" required
                   placeholder="Ej. Cardiología" value="{{ medico.especialidad if medico else '' }}">
        </div>
        <div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('bp_medicos.index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
