{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 mt-4">
    <h2 class="text-primary mb-3">Lista de Médicos</h2>
    <a href="{{ url_for('bp_medicos.crear') }}" class="btn btn-primary mb-3">Nuevo Médico</a>
    <table class="table table-striped table-hover border">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Especialidad</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for medico in medicos %}
            <tr>
                <td>{{ medico.id }}</td>
                <td>{{ medico.nombre }}</td>
                <td>{{ medico.especialidad }}</td>
                <td>
                    <a href="{{ url_for('bp_medicos.editar', id=medico.id) }}" class="btn btn-sm btn-warning">Editar</a>
                    <form action="{{ url_for('bp_medicos.eliminar', id=medico.id) }}" method="POST" class="d-inline"
                          onsubmit="return confirm('¿Eliminar médico y sus citas?')">
                        <button class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center">No hay médicos registrados</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
