{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 mt-4">
    <h2 class="text-success mb-3">Lista de Pacientes</h2>
    <a href="{{ url_for('bp_pacientes.crear') }}" class="btn btn-success mb-3">Nuevo Paciente</a>
    <table class="table table-striped table-hover border">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for paciente in pacientes %}
            <tr>
                <td>{{ paciente.id }}</td>
                <td>{{ paciente.nombre }}</td>
                <td>{{ paciente.telefono }}</td>
                <td>
                    <a href="{{ url_for('bp_pacientes.editar', id=paciente.id) }}" class="btn btn-sm btn-warning">Editar</a>
                    <form action="{{ url_for('bp_pacientes.eliminar', id=paciente.id) }}" method="POST" class="d-inline"
                          onsubmit="return confirm('¿Eliminar paciente y sus citas?')">
                        <button class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center">No hay pacientes registrados</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
